<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Data Analysis</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Netflix Data Analysis</h1>
        
        <form method="get" class="text-center my-4">
            <label for="genre" class="form-label">Filter by Genre:</label>
            <select name="genre" id="genre" class="form-select d-inline-block w-auto">
                <option value="" {% if not selected_genre %}selected{% endif %}>All</option>
                {% for genre in genres %}
                    <option value="{{ genre }}" {% if genre == selected_genre %}selected{% endif %}>{{ genre }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn btn-primary">Filter</button>
        </form>
        
        <div class="row">
            <div class="col-md-4 text-center">
                <h3>Top 10 Genres</h3>
                <a href="{{ url_for('top_genres') }}">
                    <img src="{{ url_for('static', filename='genres.png') }}" class="img-fluid rounded shadow" alt="Top 10 Genres">
                </a>
            </div>
            <div class="col-md-4 text-center">
                <h3>Content Ratings</h3>
                <a href="{{ url_for('content_ratings') }}">
                    <img src="{{ url_for('static', filename='ratings.png') }}" class="img-fluid rounded shadow" alt="Content Ratings">
                </a>
            </div>
            <div class="col-md-4 text-center">
                <h3>Trend Over the Years</h3>
                <a href="{{ url_for('trend_years') }}">
                    <img src="{{ url_for('static', filename='trend.png') }}" class="img-fluid rounded shadow" alt="Trend Over the Years">
                </a>
            </div>
        </div>
        
        {% if selected_genre %}
        <div class="row mt-4">
            <div class="col-md-12 text-center">
                <h3>Trend for {{ selected_genre }}</h3>
                <img src="{{ url_for('static', filename='filtered_trend.png') }}" class="img-fluid rounded shadow" alt="Filtered Trend">
            </div>
        </div>
        {% endif %}
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
